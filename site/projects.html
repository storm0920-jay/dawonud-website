<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><!-- 오픈할 때 이 줄을 지웁니다 -->
<title>사업실적 | 다원 도시디자인</title>
<meta name="description" content="다원 도시디자인이 수행한 경관, 공공디자인, 색채디자인, 유니버설디자인 사업 실적입니다.">
<meta property="og:title" content="사업실적 | 다원 도시디자인">
<meta property="og:description" content="다원 도시디자인이 수행한 경관, 공공디자인, 색채디자인, 유니버설디자인 사업 실적입니다.">
<meta property="og:type" content="website">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="projects.html">
<header data-site-header></header>

<main>
  <section class="page-hero">
    <div class="wrap">
      <span class="eyebrow">Projects</span>
      <h1>사업실적</h1>
      <p class="lead">다원 도시디자인이 수행한 주요 사업입니다. 분야와 연도를 골라 보고, 목록형과 카드형으로 바꿔 볼 수 있습니다.</p>
    </div>
  </section>

  <section class="section" style="padding-top:56px">
    <div class="wrap">
      <div class="filters" id="filters" role="group" aria-label="분야 선택"></div>
      <p class="note" id="count" style="margin:-12px 0 16px"></p>
      <ul class="proj-list" id="list"></ul>
      <p class="empty-state" id="empty" hidden>조건에 맞는 실적이 없습니다.</p>
    </div>
  </section>
</main>

<footer data-site-footer></footer>
<script src="assets/js/site.js"></script>
<script src="data/projects.js"></script>
<script src="assets/js/projects-ui.js"></script>
<script>
  const state = { field: new URLSearchParams(location.search).get("field") || "전체", year: "전체", view: "list" };
  try { state.view = localStorage.getItem("dawon-view") || "list"; } catch (e) {}
  const years = [...new Set(PROJECTS.map(p => p.y0))].sort((a, b) => b - a);
  const filters = document.getElementById("filters");

  filters.innerHTML =
    ["전체", ...SITE.fields].map(f => `<button type="button" data-f="${f}">${f}</button>`).join("") +
    `<select id="year" aria-label="연도 선택"><option value="전체">전체 연도</option>${years.map(y => `<option value="${y}">${y}년 시작</option>`).join("")}</select>` +
    `<span class="view-toggle" role="group" aria-label="보기 방식"><button type="button" data-v="list">목록형</button><button type="button" data-v="cards">카드형</button></span>`;

  function render() {
    filters.querySelectorAll("button[data-f]").forEach(b => b.setAttribute("aria-pressed", b.dataset.f === state.field));
    filters.querySelectorAll("button[data-v]").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === state.view));
    const list = PROJECTS.filter(p =>
      (state.field === "전체" || p.field === state.field) &&
      (state.year === "전체" || String(p.y0) === state.year));
    const ul = document.getElementById("list");
    ul.className = state.view === "cards" ? "proj-cards" : "proj-list";
    ul.innerHTML = list.map(state.view === "cards" ? projectCard : projectRow).join("");
    document.getElementById("count").textContent = `${list.length}건`;
    document.getElementById("empty").hidden = list.length > 0;
  }
  filters.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.f) state.field = b.dataset.f;
    if (b.dataset.v) { state.view = b.dataset.v; try { localStorage.setItem("dawon-view", state.view); } catch (e) {} }
    render();
  });
  document.getElementById("year").addEventListener("change", e => { state.year = e.target.value; render(); });
  render();
</script>
</body>
</html>
